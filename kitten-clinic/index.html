<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kitten Clinic</title>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html { height:100%; }
    body { background:#5c94fc; display:flex; justify-content:center; align-items:center; height:100%; overflow:hidden; font-family:'Arial Rounded MT Bold','Trebuchet MS',sans-serif;
           padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    canvas { display:block; cursor:pointer; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
'use strict';

// ════════════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════════════
const C = {
  W:480, H:720, LIVES:3, COIN:10, FAST_BONUS:5, GROUND:610,
  CLR:{
    INK:'#2b1d14', SKY1:'#5c94fc', SKY2:'#a8d4ff', RED:'#e52521', GREEN:'#43b047',
    BLUE:'#049cd8', YELLOW:'#fbd000', ORANGE:'#f08a24', BRICK:'#c8642c', BRICK2:'#8f3f17',
    CREAM:'#fff6e0', WHITE:'#ffffff', PINK:'#ff8fb1',
  },
};
const FONT=(s)=>`900 ${s}px "Arial Rounded MT Bold","Trebuchet MS","Segoe UI",sans-serif`;

// Cat beds: 3 tiers × 2 (feet position)
const SLOTS = [
  {x:125,y:270},{x:355,y:270},
  {x:125,y:440},{x:355,y:440},
  {x:125,y:C.GROUND},{x:355,y:C.GROUND},
];

// ════════════════════════════════════════════════════════════════════
// CONTENT — ailments, treatments, levels
// ════════════════════════════════════════════════════════════════════
const TREATS = {
  bandage: {name:'Bandage',      icon:'🩹'},
  medicine:{name:'Medicine',     icon:'💊'},
  fish:    {name:'Fish Snack',   icon:'🐟'},
  shampoo: {name:'Flea Shampoo', icon:'🧴'},
  water:   {name:'Cool Water',   icon:'💧'},
  ice:     {name:'Ice Pack',     icon:'🧊'},
  vaccine: {name:'Vaccine',      icon:'💉'},
  grass:   {name:'Cat Grass',    icon:'🌿'},
  blanket: {name:'Warm Blanket', icon:'🧣'},
};
// Order matters: each level unlocks the first N ailments
const AILMENTS = [
  {id:'paw',    name:'Hurt Paw',      icon:'🐾', fix:'bandage'},
  {id:'sniff',  name:'Sniffles',      icon:'🤧', fix:'medicine'},
  {id:'hungry', name:'Very Hungry',   icon:'🍽️', fix:'fish'},
  {id:'fleas',  name:'Itchy Fleas',   icon:'🐜', fix:'shampoo'},
  {id:'hot',    name:'Overheated',    icon:'🥵', fix:'water'},
  {id:'bump',   name:'Bumped Head',   icon:'🤕', fix:'ice'},
  {id:'shots',  name:'Needs Vaccine', icon:'📋', fix:'vaccine'},
  {id:'tummy',  name:'Tummy Ache',    icon:'🤢', fix:'grass'},
  {id:'cold',   name:'Shivering',     icon:'🥶', fix:'blanket'},
];
const LEVELS = [
  {id:1, name:'Morning Check-ups', goal:5,  max:2, patience:30, gap:[1.6,3.0], ailments:3, sky:'day'},
  {id:2, name:'Lunch Rush',        goal:8,  max:3, patience:25, gap:[1.3,2.6], ailments:5, sky:'day'},
  {id:3, name:'Busy Afternoon',    goal:12, max:3, patience:21, gap:[1.0,2.2], ailments:7, sky:'day'},
  {id:4, name:'Sunset Surge',      goal:16, max:4, patience:18, gap:[0.9,1.9], ailments:8, sky:'sunset'},
  {id:5, name:'Night Shift',       goal:20, max:5, patience:15, gap:[0.7,1.6], ailments:9, sky:'night'},
];
const SKIES = {
  day:   {top:'#5c94fc', bot:'#b6dcff', hill:'#43b047', hill2:'#2f8f3a'},
  sunset:{top:'#ff8a5c', bot:'#ffd38a', hill:'#3e9a46', hill2:'#2a7533'},
  night: {top:'#1d2a6b', bot:'#4b5fb8', hill:'#2c6e3a', hill2:'#1e5229'},
};
const FURS = [
  {name:'tabby',   base:'#f5a142', dark:'#d0701c'},
  {name:'gray',    base:'#a3acb7', dark:'#6e7781'},
  {name:'black',   base:'#3b3b47', dark:'#24242c'},
  {name:'white',   base:'#fbf7ee', dark:'#d9d0bf'},
  {name:'calico',  base:'#fbf7ee', dark:'#d9d0bf', patch:['#f08a24','#3b3b47']},
  {name:'siamese', base:'#f1e2c6', dark:'#6b4a33'},
  {name:'tuxedo',  base:'#2f2f3a', dark:'#1d1d25', bib:true},
];

// ════════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════════
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16),f=(v)=>Math.max(0,Math.min(255,v+amt));
  return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`;
}
// Chunky outlined game text (the "modern platformer" title look)
function bigText(ctx,str,x,y,size,fill,stroke=C.CLR.INK,align='center'){
  ctx.save();ctx.font=FONT(size);ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineJoin='round';
  ctx.lineWidth=size*0.28;ctx.strokeStyle=stroke;ctx.strokeText(str,x,y+size*0.08);
  ctx.strokeText(str,x,y);
  if(Array.isArray(fill)){const g=ctx.createLinearGradient(0,y-size/2,0,y+size/2);g.addColorStop(0,fill[0]);g.addColorStop(1,fill[1]);ctx.fillStyle=g;}
  else ctx.fillStyle=fill;
  ctx.fillText(str,x,y);ctx.restore();
}
function emoji(ctx,ch,x,y,size){
  ctx.save();ctx.font=`${size}px "Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,x,y);ctx.restore();
}
function heartPath(ctx,x,y,s){
  ctx.beginPath();ctx.moveTo(x,y+s*0.35);
  ctx.bezierCurveTo(x,y,x-s*0.5,y,x-s*0.5,y+s*0.35);
  ctx.bezierCurveTo(x-s*0.5,y+s*0.65,x,y+s*0.85,x,y+s);
  ctx.bezierCurveTo(x,y+s*0.85,x+s*0.5,y+s*0.65,x+s*0.5,y+s*0.35);
  ctx.bezierCurveTo(x+s*0.5,y,x,y,x,y+s*0.35);ctx.closePath();
}

// ════════════════════════════════════════════════════════════════════
// CAT
// ════════════════════════════════════════════════════════════════════
class Cat {
  constructor(slotIdx,ailment,patience){
    this.slot=slotIdx;this.ail=ailment;this.fur=pick(FURS);
    this.x=SLOTS[slotIdx].x;this.y=-60;this.vy=0;this.vx=0;
    this.max=patience;this.left=patience;
    this.state='drop';this.t=0;this.sq=1;this.shake=0;this.alpha=1;this.blink=rand(1,4);
    this.dir=this.x<C.W/2?-1:1;
  }
  get frac(){return Math.max(0,this.left/this.max);}
  hit(px,py){return this.state==='wait'&&Math.abs(px-this.x)<52&&py>this.y-100&&py<this.y+10;}
  update(dt){
    this.t+=dt;this.sq+=(1-this.sq)*Math.min(1,dt*10);if(this.shake>0)this.shake-=dt;
    this.blink-=dt;if(this.blink<-0.12)this.blink=rand(2,5);
    const floor=SLOTS[this.slot].y;
    if(this.state==='drop'){
      this.vy+=1800*dt;this.y+=this.vy*dt;
      if(this.y>=floor){this.y=floor;if(this.vy>300){this.vy*=-0.32;this.sq=0.7;}else{this.vy=0;this.state='wait';}}
    } else if(this.state==='happy'){
      // little hop in place, then a big leap off-screen
      if(this.t<0.5){this.y=floor-Math.sin(this.t/0.5*Math.PI)*28;}
      else{if(!this.leapt){this.leapt=true;this.vy=-780;this.vx=this.dir*260;this.sq=1.25;}
        this.vy+=1700*dt;this.y+=this.vy*dt;this.x+=this.vx*dt;}
    } else if(this.state==='miss'){
      this.alpha=Math.max(0,1-this.t/1.2);this.y-=dt*30;
    }
  }
  get done(){return (this.state==='happy'&&(this.y>C.H+120||this.x<-80||this.x>C.W+80))||(this.state==='miss'&&this.t>1.2);}
}

// Procedural cat — big head, chunky outline, expressive eyes
function drawCat(ctx,x,y,s,fur,o={}){
  const mood=o.mood||'sad',sq=o.sq||1,t=o.t||0;
  ctx.save();ctx.translate(x,y);ctx.scale(s*(2-sq),s*sq);
  ctx.lineJoin='round';ctx.lineCap='round';
  const ink=C.CLR.INK,lw=3.2/s;
  const fill=(c)=>{ctx.fillStyle=c;ctx.fill();ctx.lineWidth=lw;ctx.strokeStyle=ink;ctx.stroke();};
  // shadow
  ctx.save();ctx.globalAlpha=0.18;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,1,30,6,0,0,Math.PI*2);ctx.fill();ctx.restore();
  // tail
  const wag=Math.sin(t*(mood==='happy'?14:3))*6;
  ctx.beginPath();ctx.moveTo(18,-14);ctx.quadraticCurveTo(46,-18,38+wag,-46);
  ctx.lineWidth=13;ctx.strokeStyle=ink;ctx.stroke();ctx.lineWidth=7;ctx.strokeStyle=fur.name==='siamese'?fur.dark:fur.base;ctx.stroke();
  // body
  ctx.beginPath();ctx.ellipse(0,-20,26,20,0,0,Math.PI*2);fill(fur.base);
  if(fur.bib){ctx.beginPath();ctx.ellipse(0,-17,12,13,0,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();}
  // feet
  [-12,12].forEach(fx=>{ctx.beginPath();ctx.ellipse(fx,-3,9,6,0,0,Math.PI*2);fill(fur.bib?'#fff':fur.base);});
  // ears
  const earC=fur.name==='siamese'?fur.dark:fur.base;
  [-1,1].forEach(d=>{
    ctx.beginPath();ctx.moveTo(d*23,-56);ctx.lineTo(d*20,-84);ctx.lineTo(d*4,-70);ctx.closePath();fill(earC);
    ctx.beginPath();ctx.moveTo(d*19,-60);ctx.lineTo(d*18,-77);ctx.lineTo(d*9,-69);ctx.closePath();ctx.fillStyle=C.CLR.PINK;ctx.fill();
  });
  // head
  ctx.beginPath();ctx.arc(0,-50,25,0,Math.PI*2);fill(fur.base);
  ctx.save();ctx.beginPath();ctx.arc(0,-50,23.4,0,Math.PI*2);ctx.clip();
  if(fur.name==='tabby'){ctx.strokeStyle=fur.dark;ctx.lineWidth=3.5;[-7,0,7].forEach(sx=>{ctx.beginPath();ctx.moveTo(sx,-74);ctx.lineTo(sx,-64);ctx.stroke();});}
  if(fur.patch){ctx.fillStyle=fur.patch[0];ctx.beginPath();ctx.arc(-16,-66,14,0,Math.PI*2);ctx.fill();ctx.fillStyle=fur.patch[1];ctx.beginPath();ctx.arc(18,-60,11,0,Math.PI*2);ctx.fill();}
  if(fur.name==='siamese'){ctx.fillStyle=fur.dark;ctx.globalAlpha=0.8;ctx.beginPath();ctx.ellipse(0,-42,14,11,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
  if(fur.bib){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,-36,15,11,0,0,Math.PI*2);ctx.fill();}
  ctx.restore();
  // cheeks
  ctx.fillStyle='rgba(255,120,150,0.45)';[-15,15].forEach(cx=>{ctx.beginPath();ctx.ellipse(cx,-42,5,3.2,0,0,Math.PI*2);ctx.fill();});
  // eyes
  if(mood==='happy'){
    ctx.strokeStyle=ink;ctx.lineWidth=3.4;[-9,9].forEach(ex=>{ctx.beginPath();ctx.arc(ex,-50,5,Math.PI*1.1,Math.PI*1.9);ctx.stroke();});
  } else if(o.blink){
    ctx.strokeStyle=ink;ctx.lineWidth=3;[-9,9].forEach(ex=>{ctx.beginPath();ctx.moveTo(ex-5,-51);ctx.lineTo(ex+5,-51);ctx.stroke();});
  } else {
    [-9,9].forEach(ex=>{
      ctx.beginPath();ctx.ellipse(ex,-52,6,8,0,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=ink;ctx.stroke();
      ctx.beginPath();ctx.ellipse(ex+(mood==='sad'?0:1),-50,3.8,5.6,0,0,Math.PI*2);ctx.fillStyle=ink;ctx.fill();
      ctx.beginPath();ctx.arc(ex+1.5,-53,1.7,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
    });
    if(mood==='sad'){ // worried brows + tear
      ctx.strokeStyle=ink;ctx.lineWidth=2.4;
      ctx.beginPath();ctx.moveTo(-15,-63);ctx.lineTo(-5,-66);ctx.stroke();ctx.beginPath();ctx.moveTo(15,-63);ctx.lineTo(5,-66);ctx.stroke();
      const ty=-44+((t*14)%10);ctx.fillStyle='#7cc8ff';ctx.beginPath();ctx.ellipse(-15,ty,2.2,3.2,0,0,Math.PI*2);ctx.fill();
    }
  }
  // nose + mouth
  ctx.beginPath();ctx.moveTo(-3,-43);ctx.lineTo(3,-43);ctx.lineTo(0,-40);ctx.closePath();ctx.fillStyle=C.CLR.PINK;ctx.fill();
  ctx.strokeStyle=ink;ctx.lineWidth=1.8;ctx.beginPath();
  if(mood==='happy'){ctx.moveTo(-6,-38);ctx.quadraticCurveTo(0,-31,6,-38);}
  else{ctx.moveTo(-5,-35);ctx.quadraticCurveTo(0,-39,5,-35);}
  ctx.stroke();
  // whiskers
  ctx.lineWidth=1.3;ctx.strokeStyle=fur.base==='#3b3b47'||fur.bib?'#ddd':'#5b4a3f';
  [[-1,-42],[-1,-38],[1,-42],[1,-38]].forEach(([d,wy])=>{ctx.beginPath();ctx.moveTo(d*12,wy);ctx.lineTo(d*30,wy+(wy===-42?-3:2));ctx.stroke();});
  ctx.restore();
}

// ════════════════════════════════════════════════════════════════════
// ANIMS
// ════════════════════════════════════════════════════════════════════
class Anims {
  constructor(){this.parts=[];this.texts=[];this.flash=0;this.shake=0;}
  burst(x,y,colors,n=10,kind='dot'){for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*0.5,sp=rand(120,260);this.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,life:1,size:rand(4,8),color:pick(colors),kind});}}
  hearts(x,y,n=5){for(let i=0;i<n;i++)this.parts.push({x:x+rand(-20,20),y,vx:rand(-40,40),vy:rand(-160,-90),life:1.2,size:rand(14,22),color:pick(['#ff4f7b','#ff7aa0','#e52521']),kind:'heart',float:true});}
  coin(x,y){this.parts.push({x,y,vx:0,vy:-420,life:0.7,size:14,color:C.CLR.YELLOW,kind:'coin',spin:0});}
  text(x,y,str,color=C.CLR.YELLOW,size=26){this.texts.push({x,y,str,color,size,life:1.2,vy:-55});}
  update(dt){
    this.parts=this.parts.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.float)p.vy+=900*dt;p.life-=dt*1.4;if(p.kind==='coin')p.spin+=dt*14;return p.life>0;});
    this.texts=this.texts.filter(t=>{t.y+=t.vy*dt;t.life-=dt;return t.life>0;});
    if(this.flash>0)this.flash-=dt*3;if(this.shake>0)this.shake-=dt;
  }
  render(ctx){
    this.parts.forEach(p=>{ctx.save();ctx.globalAlpha=Math.min(1,p.life*1.5);
      if(p.kind==='heart'){ctx.fillStyle=p.color;heartPath(ctx,p.x,p.y-p.size/2,p.size);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=C.CLR.INK;ctx.stroke();}
      else if(p.kind==='coin'){ctx.translate(p.x,p.y);ctx.scale(Math.abs(Math.cos(p.spin))+0.15,1);drawCoin(ctx,0,0,p.size);}
      else if(p.kind==='star'){drawStar(ctx,p.x,p.y,p.size,p.color);}
      else{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}
      ctx.restore();});
    this.texts.forEach(t=>{ctx.save();ctx.globalAlpha=Math.min(1,t.life*2);bigText(ctx,t.str,t.x,t.y,t.size,t.color);ctx.restore();});
    if(this.flash>0){ctx.save();ctx.globalAlpha=this.flash;ctx.fillStyle='#fff';ctx.fillRect(0,0,C.W,C.H);ctx.restore();}
  }
}
function drawCoin(ctx,x,y,r){
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=C.CLR.YELLOW;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=C.CLR.INK;ctx.stroke();
  ctx.beginPath();ctx.arc(x,y,r*0.68,0,Math.PI*2);ctx.strokeStyle='#d99a00';ctx.lineWidth=2;ctx.stroke();
  // paw print
  ctx.fillStyle='#d99a00';ctx.beginPath();ctx.ellipse(x,y+r*0.15,r*0.24,r*0.2,0,0,Math.PI*2);ctx.fill();
  [[-0.27,-0.18],[-0.09,-0.32],[0.09,-0.32],[0.27,-0.18]].forEach(([dx,dy])=>{ctx.beginPath();ctx.arc(x+dx*r,y+dy*r,r*0.09,0,Math.PI*2);ctx.fill();});
}
function drawStar(ctx,x,y,r,color,stroke=true){
  ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*0.48:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();
  ctx.fillStyle=color;ctx.fill();if(stroke){ctx.lineJoin='round';ctx.lineWidth=Math.max(2,r*0.14);ctx.strokeStyle=C.CLR.INK;ctx.stroke();}
}

// ════════════════════════════════════════════════════════════════════
// AUDIO — chiptune-style blips (WebAudio, no assets)
// ════════════════════════════════════════════════════════════════════
class Audio {
  constructor(){try{this.ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  _beep(freq,dur,wave='square',vol=0.12){if(!this.ac)return;if(this.ac.state==='suspended')this.ac.resume();const o=this.ac.createOscillator(),g=this.ac.createGain();o.connect(g);g.connect(this.ac.destination);o.type=wave;o.frequency.value=freq;g.gain.setValueAtTime(vol,this.ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,this.ac.currentTime+dur);o.start();o.stop(this.ac.currentTime+dur);}
  _seq(notes,step,dur,wave,vol){notes.forEach((f,i)=>setTimeout(()=>this._beep(f,dur,wave,vol),i*step));}
  tap()   {this._beep(660,0.05,'square',0.08);}
  meow()  {if(!this.ac)return;const o=this.ac.createOscillator(),g=this.ac.createGain(),t=this.ac.currentTime;o.type='triangle';o.connect(g);g.connect(this.ac.destination);o.frequency.setValueAtTime(700,t);o.frequency.exponentialRampToValueAtTime(1100,t+0.12);o.frequency.exponentialRampToValueAtTime(500,t+0.35);g.gain.setValueAtTime(0.13,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.38);o.start();o.stop(t+0.4);}
  heal()  {this._seq([988,1319],70,0.18,'square',0.1);}
  wrong() {this._seq([220,160],110,0.2,'sawtooth',0.1);}
  miss()  {this._seq([523,415,330],120,0.2,'triangle',0.15);}
  win()   {this._seq([523,659,784,1047,784,1047],110,0.22,'square',0.1);}
  lose()  {this._seq([392,370,349,330],180,0.3,'triangle',0.15);}
}

// ════════════════════════════════════════════════════════════════════
// RENDERER — scenery, HUD, panels, buttons
// ════════════════════════════════════════════════════════════════════
class Renderer {
  constructor(canvas){
    this.canvas=canvas;this.ctx=canvas.getContext('2d');
    const dpr=window.devicePixelRatio||1;
    canvas.width=C.W*dpr;canvas.height=C.H*dpr;this.ctx.scale(dpr,dpr);
    this.btns=[];this._bars='';
  }
  bars(top,bot){const v=`linear-gradient(${top} 50%,${bot} 50%)`;if(v!==this._bars){this._bars=v;document.body.style.background=v;}}
  // Every button drawn this frame registers its own hit box
  button(x,y,w,h,label,color,fn,o={}){
    const ctx=this.ctx,r=o.r??h/2,press=0;
    ctx.save();
    ctx.fillStyle=shade(color,-70);rrect(ctx,x,y+6,w,h,r);ctx.fill();
    ctx.fillStyle=color;rrect(ctx,x,y+press,w,h,r);ctx.fill();
    ctx.save();rrect(ctx,x,y,w,h,r);ctx.clip();ctx.fillStyle='rgba(255,255,255,0.28)';ctx.fillRect(x,y,w,h*0.42);ctx.restore();
    ctx.lineWidth=4;ctx.strokeStyle=C.CLR.INK;rrect(ctx,x,y,w,h+6,r);ctx.stroke();
    if(o.icon){emoji(ctx,o.icon,x+38,y+h/2+1,h*0.52);bigText(ctx,label,x+70,y+h/2,o.size||22,'#fff',C.CLR.INK,'left');}
    else bigText(ctx,label,x+w/2,y+h/2,o.size||24,'#fff');
    ctx.restore();
    this.btns.push({x,y,w,h:h+6,fn});
  }
  sky(kind,t){
    const ctx=this.ctx,s=SKIES[kind];
    const g=ctx.createLinearGradient(0,0,0,C.H);g.addColorStop(0,s.top);g.addColorStop(1,s.bot);ctx.fillStyle=g;ctx.fillRect(0,0,C.W,C.H);
    if(kind==='night'){ctx.fillStyle='#fff';for(let i=0;i<40;i++){const sx=(i*97)%C.W,sy=(i*53)%330,tw=0.5+0.5*Math.sin(t*3+i);ctx.globalAlpha=0.4+0.6*tw;ctx.fillRect(sx,sy,2,2);}ctx.globalAlpha=1;
      ctx.beginPath();ctx.arc(390,90,30,0,Math.PI*2);ctx.fillStyle='#fff6c8';ctx.fill();ctx.beginPath();ctx.arc(378,82,30,0,Math.PI*2);ctx.fillStyle=s.top;ctx.fill();}
    else if(kind==='sunset'){ctx.beginPath();ctx.arc(380,380,60,0,Math.PI*2);ctx.fillStyle='rgba(255,236,150,0.85)';ctx.fill();}
    // clouds drift
    [[60,120,1],[300,70,0.8],[200,200,0.65]].forEach(([cx,cy,sc],i)=>{
      const x=((cx+t*(8+i*4))%(C.W+160))-80;this.cloud(x,cy,sc,kind==='night'?0.35:1);
    });
    // hills
    this.hill(70,C.GROUND,170,s.hill2);this.hill(430,C.GROUND,140,s.hill2);this.hill(260,C.GROUND,110,s.hill);
  }
  cloud(x,y,s,a){
    const ctx=this.ctx;ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.scale(s,s);
    ctx.beginPath();ctx.arc(-30,8,22,0,Math.PI*2);ctx.arc(0,-4,30,0,Math.PI*2);ctx.arc(32,8,22,0,Math.PI*2);ctx.rect(-30,8,62,22);
    ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='rgba(43,29,20,0.35)';ctx.stroke();
    ctx.beginPath();ctx.arc(-30,8,20,0,Math.PI*2);ctx.arc(0,-4,28,0,Math.PI*2);ctx.arc(32,8,20,0,Math.PI*2);ctx.rect(-30,8,62,20);ctx.fill();
    ctx.restore();
  }
  hill(cx,base,r,c){
    const ctx=this.ctx;ctx.beginPath();ctx.ellipse(cx,base,r,r*1.05,0,Math.PI,0);ctx.fillStyle=c;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=C.CLR.INK;ctx.stroke();
    ctx.fillStyle='rgba(0,0,0,0.18)';[[-0.3,0.45],[0.25,0.6],[0,0.3]].forEach(([dx,dy])=>{ctx.beginPath();ctx.ellipse(cx+dx*r,base-dy*r,5,8,0,0,Math.PI*2);ctx.fill();});
  }
  clinic(){ // background building with red cross
    const ctx=this.ctx,x=150,y=300,w=180,h=C.GROUND-y;
    ctx.save();ctx.globalAlpha=0.55;
    ctx.fillStyle='#fdf0dc';rrect(ctx,x,y,w,h,8);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=C.CLR.INK;ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-14,y+4);ctx.lineTo(x+w/2,y-46);ctx.lineTo(x+w+14,y+4);ctx.closePath();ctx.fillStyle=C.CLR.RED;ctx.fill();ctx.stroke();
    ctx.fillStyle=C.CLR.RED;ctx.fillRect(x+w/2-7,y+24,14,40);ctx.fillRect(x+w/2-20,y+37,40,14);
    ctx.fillStyle='#8fd0ff';[[x+22,y+90],[x+w-62,y+90]].forEach(([wx,wy])=>{rrect(ctx,wx,wy,40,36,5);ctx.fill();ctx.stroke();});
    ctx.restore();
  }
  // Brick / cross blocks — the platforming look
  block(x,y,s,kind){
    const ctx=this.ctx;
    if(kind==='cross'){
      ctx.fillStyle=C.CLR.YELLOW;rrect(ctx,x,y,s,s,6);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=C.CLR.INK;ctx.stroke();
      ctx.fillStyle='#d99a00';[[5,5],[s-8,5],[5,s-8],[s-8,s-8]].forEach(([dx,dy])=>{ctx.fillRect(x+dx,y+dy,3,3);});
      ctx.fillStyle='#fff';const c=s/2;ctx.fillRect(x+c-4,y+8,8,s-16);ctx.fillRect(x+8,y+c-4,s-16,8);
      ctx.fillStyle=C.CLR.RED;ctx.fillRect(x+c-2.5,y+10,5,s-20);ctx.fillRect(x+10,y+c-2.5,s-20,5);
    } else {
      ctx.fillStyle=C.CLR.BRICK;rrect(ctx,x,y,s,s,4);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=C.CLR.INK;ctx.stroke();
      ctx.strokeStyle=C.CLR.BRICK2;ctx.lineWidth=2;ctx.beginPath();
      ctx.moveTo(x+3,y+s/2);ctx.lineTo(x+s-3,y+s/2);ctx.moveTo(x+s/2,y+3);ctx.lineTo(x+s/2,y+s/2);ctx.moveTo(x+s/4,y+s/2);ctx.lineTo(x+s/4,y+s-3);ctx.moveTo(x+s*0.75,y+s/2);ctx.lineTo(x+s*0.75,y+s-3);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(x+3,y+3,s-6,3);
    }
  }
  platform(cx,y,n,crossAt=-1){const s=34,x0=cx-n*s/2;for(let i=0;i<n;i++)this.block(x0+i*s,y,s,i===crossAt?'cross':'brick');}
  ground(){
    const ctx=this.ctx,y=C.GROUND;
    ctx.fillStyle='#5fcf4f';ctx.fillRect(0,y,C.W,14);ctx.fillStyle='#3c9b33';ctx.fillRect(0,y+10,C.W,4);
    ctx.lineWidth=3;ctx.strokeStyle=C.CLR.INK;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(C.W,y);ctx.stroke();
    for(let row=0;row<4;row++)for(let i=-1;i<16;i++){const s=34,x=i*s+(row%2?17:0);this.block(x,y+14+row*s,s,'brick');}
  }
  bed(x,y){ // cushion under each cat slot
    const ctx=this.ctx;ctx.beginPath();ctx.ellipse(x,y-4,44,11,0,0,Math.PI*2);ctx.fillStyle='#4aa3ff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=C.CLR.INK;ctx.stroke();
    ctx.beginPath();ctx.ellipse(x,y-7,36,6,0,0,Math.PI*2);ctx.fillStyle='#8fd0ff';ctx.fill();
  }
  clinicStage(){
    this.clinic();
    this.platform(SLOTS[0].x,SLOTS[0].y,5,2);this.platform(SLOTS[1].x,SLOTS[1].y,5,2);
    this.platform(SLOTS[2].x,SLOTS[2].y,4,-1);this.platform(SLOTS[3].x,SLOTS[3].y,4,-1);
    this.ground();
    SLOTS.forEach(s=>this.bed(s.x,s.y));
  }
  // Ailment bubble with patience ring
  bubble(cat,t){
    const ctx=this.ctx,f=cat.frac,bx=cat.x+38,by=cat.y-104;
    const wob=f<0.3?Math.sin(t*30)*2:0;
    ctx.save();ctx.translate(bx+wob,by);
    ctx.beginPath();ctx.moveTo(-14,18);ctx.lineTo(-26,32);ctx.lineTo(-2,22);ctx.closePath();ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=C.CLR.INK;ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,27,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,27,-Math.PI/2,-Math.PI/2+Math.PI*2*f);ctx.lineWidth=6;ctx.strokeStyle=f>0.55?C.CLR.GREEN:f>0.3?C.CLR.YELLOW:C.CLR.RED;ctx.stroke();
    emoji(ctx,cat.ail.icon,0,1,26);
    ctx.restore();
  }
  hud(game){
    const ctx=this.ctx,lv=game.lv;
    ctx.save();ctx.fillStyle='rgba(43,29,20,0.82)';rrect(ctx,8,8,C.W-16,92,18);ctx.fill();
    // lives
    for(let i=0;i<C.LIVES;i++){ctx.fillStyle=i<game.lives?'#ff4f7b':'#5a4a40';heartPath(ctx,34+i*34,20,26);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#120c08';ctx.stroke();}
    // level pill
    bigText(ctx,`LEVEL ${lv.id}`,C.W/2,32,22,['#fff','#ffe27a']);
    // coins
    drawCoin(ctx,C.W-108,32,13);bigText(ctx,`${game.meta.coins+(game.banked?0:game.coins)}`,C.W-88,33,22,'#fff',C.CLR.INK,'left');
    // progress
    const px=24,py=60,pw=C.W-110,ph=24,f=Math.min(1,game.saved/lv.goal);
    ctx.fillStyle='#120c08';rrect(ctx,px,py,pw,ph,12);ctx.fill();
    if(f>0){ctx.fillStyle=C.CLR.GREEN;rrect(ctx,px+3,py+3,Math.max(18,(pw-6)*f),ph-6,9);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.3)';rrect(ctx,px+3,py+3,Math.max(18,(pw-6)*f),(ph-6)/2,6);ctx.fill();}
    bigText(ctx,`🐱 ${game.saved} / ${lv.goal} SAVED`,px+pw/2,py+ph/2+1,16,'#fff');
    ctx.restore();
    // home button
    this.button(C.W-74,56,54,30,'II',C.CLR.BLUE,()=>game.pause(),{r:12,size:16});
  }
  panel(x,y,w,h,title,color=C.CLR.RED){
    const ctx=this.ctx;
    ctx.save();ctx.fillStyle='rgba(20,12,6,0.55)';ctx.fillRect(0,0,C.W,C.H);
    ctx.fillStyle=shade(C.CLR.CREAM,-60);rrect(ctx,x,y+8,w,h,26);ctx.fill();
    ctx.fillStyle=C.CLR.CREAM;rrect(ctx,x,y,w,h,26);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=C.CLR.INK;rrect(ctx,x,y,w,h+8,26);ctx.stroke();
    // ribbon
    ctx.fillStyle=color;rrect(ctx,x+30,y-26,w-60,52,18);ctx.fill();ctx.lineWidth=4;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.25)';rrect(ctx,x+34,y-22,w-68,18,10);ctx.fill();
    bigText(ctx,title,x+w/2,y,28,'#fff');
    ctx.restore();
  }
}

// STORAGE — same pattern as Slapshot Saga (localStorage + WKWebView bridge)
// ════════════════════════════════════════════════════════════════════
const KC_KEY='kc_meta';
function storageSave(data){
  const json=JSON.stringify(data);
  try{ localStorage.setItem(KC_KEY,json); }catch(_){}
  try{ window.webkit?.messageHandlers?.gameStorage?.postMessage({action:'save',value:json}); }catch(_){}
}
function storageLoad(){
  if(window.__kc_saved){ try{ return JSON.parse(window.__kc_saved); }catch(_){} }
  try{ const s=localStorage.getItem(KC_KEY); return s?JSON.parse(s):null; }catch(_){ return null; }
}

// ════════════════════════════════════════════════════════════════════
// GAME
// ════════════════════════════════════════════════════════════════════
const S={MENU:'menu',MAP:'map',INTRO:'intro',PLAY:'play',TREAT:'treat',PAUSE:'pause',WIN:'win',LOSE:'lose'};

class Game {
  constructor(canvas){
    this.canvas=canvas;this.r=new Renderer(canvas);this.sfx=new Audio();this.fx=new Anims();
    this.state=S.MENU;this.t=0;
    this.meta={unlocked:1,stars:{},coins:0};
    const m=storageLoad();if(m)this.meta={...this.meta,...m};
    canvas.addEventListener('pointerdown',e=>{e.preventDefault();this._tap(e);});
    let last=performance.now();
    const loop=(ts)=>{const dt=Math.min((ts-last)/1000,0.05);last=ts;this._update(dt);this._draw();requestAnimationFrame(loop);};
    requestAnimationFrame(loop);
  }
  _save(){storageSave(this.meta);}

  startLevel(idx){
    this.lvIdx=idx;this.lv=LEVELS[idx];
    this.cats=[];this.saved=0;this.lives=C.LIVES;this.coins=0;this.spawnT=0.6;this.treat=null;this.endT=0;this.lastAil=null;this.banked=false;
    this.fx=new Anims();this.introT=2.2;this.state=S.INTRO;
  }
  pause(){if(this.state===S.PLAY)this.state=S.PAUSE;}

  _spawn(){
    const free=SLOTS.map((_,i)=>i).filter(i=>!this.cats.some(c=>c.slot===i&&(c.state==='drop'||c.state==='wait')));
    if(!free.length)return;
    const pool=AILMENTS.slice(0,this.lv.ailments).filter(a=>a!==this.lastAil);
    const ail=pick(pool);this.lastAil=ail;
    this.cats.push(new Cat(pick(free),ail,this.lv.patience*rand(0.85,1.15)));
    this.sfx.meow();
  }
  get active(){return this.cats.filter(c=>c.state==='drop'||c.state==='wait').length;}

  _update(dt){
    this.t+=dt;this.fx.update(dt);
    if(this.state===S.INTRO){this.introT-=dt;if(this.introT<=0)this.state=S.PLAY;}
    if(this.state===S.PLAY||this.state===S.TREAT){
      this.spawnT-=dt;
      if(this.spawnT<=0&&this.active<this.lv.max&&this.saved+this.active<this.lv.goal&&this.lives>0){this._spawn();this.spawnT=rand(...this.lv.gap);}
      this.cats.forEach(c=>{
        c.update(dt);
        if(c.state==='wait'){c.left-=dt;if(c.left<=0)this._miss(c);}
      });
      this.cats=this.cats.filter(c=>!c.done);
      if(this.endT>0){this.endT-=dt;if(this.endT<=0)this._finish();}
    } else if(this.cats){this.cats.forEach(c=>{if(c.state==='happy'||c.state==='miss'||c.state==='drop')c.update(dt);});}
  }
  _miss(c){
    c.state='miss';c.t=0;this.lives--;this.sfx.miss();this.fx.shake=0.3;
    this.fx.text(c.x,c.y-60,'TO THE BIG HOSPITAL!',C.CLR.WHITE,16);
    if(this.treat?.cat===c){this.treat=null;this.state=S.PLAY;}
    if(this.lives<=0&&!this.endT)this.endT=0.9;
  }
  _choose(key){
    const c=this.treat.cat;this.treat=null;this.state=S.PLAY;
    if(c.state!=='wait')return;
    if(key===c.ail.fix){
      c.state='happy';c.t=0;this.saved++;
      const fast=c.frac>0.6,gain=C.COIN+(fast?C.FAST_BONUS:0);this.coins+=gain;
      this.sfx.heal();setTimeout(()=>this.sfx.meow(),150);
      this.fx.hearts(c.x,c.y-60,6);this.fx.burst(c.x,c.y-40,[C.CLR.YELLOW,'#fff',C.CLR.PINK],12);
      for(let i=0;i<(fast?2:1);i++)setTimeout(()=>this.fx.coin(c.x+i*24-12,c.y-90),i*120);
      this.fx.text(c.x,c.y-120,fast?`FAST! +${gain}`:`SAVED! +${gain}`,C.CLR.YELLOW,24);
      if(this.saved>=this.lv.goal&&!this.endT)this.endT=1.2;
    } else {
      this.lives--;c.shake=0.4;c.left=Math.max(0.01,c.left-c.max*0.15);
      this.sfx.wrong();this.fx.shake=0.35;
      this.fx.text(c.x,c.y-120,'WRONG CURE!',C.CLR.RED,24);
      if(this.lives<=0&&!this.endT)this.endT=0.9;
    }
  }
  _finish(){
    if(this.lives>0&&this.saved>=this.lv.goal){
      const lost=C.LIVES-this.lives;this.winStars=lost===0?3:lost===1?2:1;
      const id=this.lv.id;this.meta.stars[id]=Math.max(this.meta.stars[id]||0,this.winStars);
      this.meta.unlocked=Math.max(this.meta.unlocked,Math.min(LEVELS.length,id+1));
      this.meta.coins+=this.coins;this.banked=true;this._save();
      this.state=S.WIN;this.sfx.win();
      for(let i=0;i<4;i++)setTimeout(()=>this.fx.burst(rand(80,400),rand(150,300),[C.CLR.YELLOW,C.CLR.RED,C.CLR.GREEN,C.CLR.BLUE,'#fff'],16),i*200);
    } else {this.state=S.LOSE;this.sfx.lose();}
  }

  _tap(e){
    const rect=this.canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left)*C.W/rect.width,y=(e.clientY-rect.top)*C.H/rect.height;
    this.sfx.ac?.state==='suspended'&&this.sfx.ac.resume();
    // buttons registered during the last draw get first pick (topmost last)
    for(let i=this.r.btns.length-1;i>=0;i--){const b=this.r.btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){this.sfx.tap();b.fn();return;}}
    if(this.state===S.MENU){this.state=S.MAP;this.sfx.tap();return;}
    if(this.state===S.TREAT){this.treat=null;this.state=S.PLAY;return;} // tap outside closes
    if(this.state===S.PLAY){
      const c=[...this.cats].reverse().find(c=>c.hit(x,y));
      if(c){
        const others=shuffle(Object.keys(TREATS).filter(k=>k!==c.ail.fix&&AILMENTS.slice(0,Math.max(3,this.lv.ailments)).some(a=>a.fix===k))).slice(0,2);
        this.treat={cat:c,opts:shuffle([c.ail.fix,...others]),t:0};this.state=S.TREAT;this.sfx.tap();
      }
    }
  }

  // ── DRAW ──────────────────────────────────────────────────────────
  _draw(){
    const r=this.r,ctx=r.ctx;r.btns=[];
    ctx.save();
    if(this.fx.shake>0)ctx.translate(Math.sin(this.t*80)*6*this.fx.shake/0.35,0);
    const sky=SKIES[this.state===S.MENU||this.state===S.MAP?'day':this.lv.sky];
    r.bars(sky.top,this.state===S.MAP?sky.bot:C.CLR.BRICK);
    if(this.state===S.MENU)this._drawMenu();
    else if(this.state===S.MAP)this._drawMap();
    else this._drawPlay();
    ctx.restore();
  }
  _drawMenu(){
    const r=this.r,ctx=r.ctx,t=this.t;
    r.sky('day',t);r.ground();
    // logo
    const bob=Math.sin(t*2.2)*5;
    ctx.save();ctx.translate(C.W/2,150+bob);ctx.rotate(-0.04);
    bigText(ctx,'KITTEN',0,-40,76,['#ffe680','#f6a400']);
    bigText(ctx,'CLINIC',0,40,76,['#ff6b6b','#d01c1c']);
    ctx.restore();
    ctx.save();ctx.translate(C.W/2,245+bob);ctx.fillStyle=C.CLR.GREEN;rrect(ctx,-92,-20,184,40,20);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=C.CLR.INK;ctx.stroke();
    bigText(ctx,'RESCUE!',0,1,26,'#fff');ctx.restore();
    // cross blocks
    [70,410].forEach((bx,i)=>{const by=350+Math.sin(t*3+i*2)*6;r.block(bx-22,by,44,'cross');});
    // bouncing cats on the grass
    [[95,FURS[0],0],[240,FURS[4],1],[385,FURS[2],2]].forEach(([cx,fur,i])=>{
      const hop=Math.max(0,Math.sin(t*4+i*1.3))*36;
      drawCat(ctx,cx,C.GROUND-hop,1.25,fur,{mood:'happy',t,sq:hop<3?0.88:1.04});
    });
    r.button(C.W/2-120,430,240,74,'PLAY',C.CLR.GREEN,()=>{this.state=S.MAP;},{size:36});
    ctx.save();ctx.globalAlpha=0.6+0.4*Math.sin(t*4);bigText(ctx,'Help the vet save every kitten!',C.W/2,305,17,'#fff');ctx.restore();
  }
  _mapNodes(){return [{x:110,y:560},{x:330,y:500},{x:150,y:400},{x:350,y:300},{x:200,y:190}];}
  _drawMap(){
    const r=this.r,ctx=r.ctx,t=this.t,nodes=this._mapNodes();
    r.sky('day',t);
    // map island
    ctx.fillStyle='#5fcf4f';ctx.beginPath();ctx.ellipse(C.W/2,420,260,300,0,0,Math.PI*2);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=C.CLR.INK;ctx.stroke();
    ctx.fillStyle='#4bb83c';ctx.beginPath();ctx.ellipse(C.W/2,430,220,260,0,0,Math.PI*2);ctx.fill();
    // path
    ctx.save();ctx.setLineDash([2,16]);ctx.lineCap='round';ctx.lineWidth=12;ctx.strokeStyle='#fff3c4';
    ctx.beginPath();nodes.forEach((n,i)=>i?ctx.lineTo(n.x,n.y):ctx.moveTo(n.x,n.y));ctx.stroke();ctx.restore();
    // trees
    [[60,450],[420,420],[420,600],[70,280],[290,630],[290,250]].forEach(([tx,ty])=>{ctx.beginPath();ctx.arc(tx,ty,18,0,Math.PI*2);ctx.fillStyle='#2f8f3a';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=C.CLR.INK;ctx.stroke();ctx.fillStyle='rgba(255,255,255,0.2)';ctx.beginPath();ctx.arc(tx-5,ty-6,6,0,Math.PI*2);ctx.fill();});
    nodes.forEach((n,i)=>{
      const lv=LEVELS[i],open=lv.id<=this.meta.unlocked,stars=this.meta.stars[lv.id]||0,cur=lv.id===this.meta.unlocked;
      const by=cur?Math.sin(t*4)*4:0;
      ctx.save();ctx.translate(n.x,n.y+by);
      ctx.fillStyle=shade(open?C.CLR.RED:'#8a8a8a',-70);ctx.beginPath();ctx.ellipse(0,8,36,30,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=open?(stars?C.CLR.GREEN:C.CLR.RED):'#9a9a9a';ctx.beginPath();ctx.ellipse(0,0,36,30,0,0,Math.PI*2);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=C.CLR.INK;ctx.stroke();
      if(open)bigText(ctx,`${lv.id}`,0,0,30,'#fff');else emoji(ctx,'🔒',0,0,26);
      for(let s=0;s<3;s++)drawStar(ctx,-22+s*22,40,10,s<stars?C.CLR.YELLOW:'#d8cfb8');
      ctx.restore();
      if(open){
        ctx.save();ctx.font=FONT(13);ctx.textAlign='center';ctx.fillStyle=C.CLR.INK;ctx.fillText(`${lv.name} · ${lv.goal} cats`,n.x,n.y-44+by);ctx.restore();
        r.btns.push({x:n.x-40,y:n.y-36,w:80,h:72,fn:()=>this.startLevel(i)});
      }
      if(cur)drawCat(ctx,n.x+44,n.y+20,0.55,FURS[0],{mood:'happy',t});
    });
    // header
    ctx.fillStyle='rgba(43,29,20,0.82)';rrect(ctx,8,8,C.W-16,64,18);ctx.fill();
    bigText(ctx,'CLINIC MAP',C.W/2,40,30,['#fff','#ffe27a']);
    drawCoin(ctx,C.W-110,40,13);bigText(ctx,`${this.meta.coins}`,C.W-90,41,20,'#fff',C.CLR.INK,'left');
    r.button(20,22,56,36,'◀',C.CLR.BLUE,()=>{this.state=S.MENU;},{r:12,size:18});
  }
  _drawPlay(){
    const r=this.r,ctx=r.ctx,t=this.t,lv=this.lv;
    r.sky(lv.sky,t);r.clinicStage();
    // cats (sorted so lower tiers draw on top)
    [...this.cats].sort((a,b)=>a.y-b.y).forEach(c=>{
      ctx.save();ctx.globalAlpha=c.alpha;
      const sx=c.shake>0?Math.sin(this.t*70)*5:0;
      const sel=this.treat?.cat===c;
      if(sel){ctx.beginPath();ctx.ellipse(c.x,c.y-4,52,14,0,0,Math.PI*2);ctx.fillStyle='rgba(251,208,0,0.6)';ctx.fill();}
      drawCat(ctx,c.x+sx,c.y,1.15,c.fur,{mood:c.state==='happy'?'happy':c.state==='miss'?'sad':(c.frac>0.55?'neutral':'sad'),t:t+c.slot,sq:c.sq,blink:c.blink<0});
      if(c.state==='miss')emoji(ctx,'🚑',c.x,c.y-30,40);
      ctx.restore();
      if(c.state==='wait')r.bubble(c,t);
    });
    this.fx.render(ctx);
    r.hud(this);
    if(this.state===S.INTRO)this._drawIntro();
    if(this.state===S.TREAT)this._drawTreat();
    if(this.state===S.PAUSE)this._drawPause();
    if(this.state===S.WIN)this._drawWin();
    if(this.state===S.LOSE)this._drawLose();
  }
  _drawIntro(){
    const r=this.r,ctx=r.ctx,lv=this.lv,a=Math.min(1,this.introT*2),pop=Math.min(1,(2.2-this.introT)*5);
    ctx.save();ctx.globalAlpha=a;ctx.translate(C.W/2,C.H/2-40);ctx.scale(0.6+0.4*pop,0.6+0.4*pop);ctx.translate(-C.W/2,-(C.H/2-40));
    r.panel(60,250,360,170,`LEVEL ${lv.id}`,C.CLR.BLUE);
    bigText(ctx,lv.name,C.W/2,300,22,C.CLR.ORANGE);
    bigText(ctx,`Save ${lv.goal} kittens!`,C.W/2,345,30,'#fff');
    ctx.font=FONT(14);ctx.textAlign='center';ctx.fillStyle=C.CLR.INK;ctx.fillText('Tap a kitten · pick the right cure',C.W/2,388);
    ctx.restore();
  }
  _drawTreat(){
    const r=this.r,ctx=r.ctx,c=this.treat.cat,ail=c.ail;this.treat.t+=1/60;
    const pop=Math.min(1,this.treat.t*7),ease=1+Math.sin(pop*Math.PI)*0.08;
    ctx.save();ctx.translate(C.W/2,C.H/2);ctx.scale(pop*ease,pop*ease);ctx.translate(-C.W/2,-C.H/2);
    const px=40,py=150,pw=400,ph=470;
    r.panel(px,py,pw,ph,'TREATMENT',C.CLR.RED);
    // patient card
    ctx.fillStyle='#ffe9b8';rrect(ctx,px+24,py+40,pw-48,140,18);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=C.CLR.INK;ctx.stroke();
    drawCat(ctx,px+100,py+168,1.3,c.fur,{mood:'sad',t:this.t});
    emoji(ctx,ail.icon,px+262,py+88,40);
    bigText(ctx,ail.name,px+262,py+134,22,C.CLR.RED);
    // patience bar
    const bw=140,bx=px+192,by=py+158;ctx.fillStyle='#120c08';rrect(ctx,bx,by,bw,10,5);ctx.fill();
    ctx.fillStyle=c.frac>0.55?C.CLR.GREEN:c.frac>0.3?C.CLR.YELLOW:C.CLR.RED;rrect(ctx,bx+2,by+2,Math.max(4,(bw-4)*c.frac),6,3);ctx.fill();
    ctx.font=FONT(15);ctx.textAlign='center';ctx.fillStyle=C.CLR.INK;ctx.fillText('Which cure will help?',C.W/2,py+212);
    const cols=[C.CLR.RED,C.CLR.GREEN,C.CLR.BLUE];
    ctx.restore();
    // buttons drawn unscaled once the pop-in finishes so hit boxes match
    if(pop>=1)this.treat.opts.forEach((k,i)=>r.button(px+36,py+236+i*76,pw-72,62,TREATS[k].name,cols[i],()=>this._choose(k),{icon:TREATS[k].icon,r:18,size:22}));
  }
  _drawPause(){
    const r=this.r;r.panel(80,250,320,250,'PAUSED',C.CLR.BLUE);
    r.button(120,300,240,60,'RESUME',C.CLR.GREEN,()=>{this.state=S.PLAY;});
    r.button(120,390,240,60,'MAP',C.CLR.ORANGE,()=>{this.state=S.MAP;});
  }
  _drawWin(){
    const r=this.r,ctx=r.ctx,last=this.lvIdx===LEVELS.length-1;
    r.panel(50,190,380,380,last?'ALL SAVED!':'LEVEL CLEAR!',C.CLR.GREEN);
    for(let s=0;s<3;s++){const on=s<this.winStars,sc=on?1+Math.sin(this.t*5+s)*0.05:1;ctx.save();ctx.translate(C.W/2+(s-1)*78,s===1?262:276);ctx.scale(sc,sc);drawStar(ctx,0,0,s===1?36:30,on?C.CLR.YELLOW:'#d8cfb8');ctx.restore();}
    bigText(ctx,`🐱 ${this.saved} kittens saved`,C.W/2,330,22,'#fff');
    ctx.font=FONT(24);const cw=ctx.measureText(`+${this.coins}`).width,cx0=C.W/2-(cw+34)/2;
    drawCoin(ctx,cx0+13,370,13);bigText(ctx,`+${this.coins}`,cx0+34,371,24,C.CLR.YELLOW,C.CLR.INK,'left');
    if(last){ctx.font=FONT(15);ctx.textAlign='center';ctx.fillStyle=C.CLR.INK;ctx.fillText("You're a super vet! 🏆",C.W/2,405);}
    if(!last)r.button(90,420,300,62,'NEXT LEVEL',C.CLR.GREEN,()=>this.startLevel(this.lvIdx+1));
    else r.button(90,420,300,62,'PLAY AGAIN',C.CLR.GREEN,()=>this.startLevel(0));
    r.button(90,500,300,52,'MAP',C.CLR.BLUE,()=>{this.state=S.MAP;},{size:20});
  }
  _drawLose(){
    const r=this.r,ctx=r.ctx;
    r.panel(60,200,360,350,'OH NO!',C.CLR.RED);
    drawCat(ctx,C.W/2,355,1.2,FURS[1],{mood:'sad',t:this.t});
    ctx.font=FONT(16);ctx.textAlign='center';ctx.fillStyle=C.CLR.INK;ctx.fillText(`The clinic got too busy! (${this.saved}/${this.lv.goal})`,C.W/2,390);
    r.button(100,415,280,60,'TRY AGAIN',C.CLR.GREEN,()=>this.startLevel(this.lvIdx));
    r.button(100,490,280,48,'MAP',C.CLR.BLUE,()=>{this.state=S.MAP;},{size:20});
  }
}

// ════════════════════════════════════════════════════════════════════
// BOOTSTRAP
// ════════════════════════════════════════════════════════════════════
window.addEventListener('load',()=>{
  const canvas=document.getElementById('gameCanvas');
  const fit=()=>{
    const b=document.body;
    const s=Math.min(b.clientWidth/C.W,b.clientHeight/C.H);
    canvas.style.width=`${C.W*s}px`; canvas.style.height=`${C.H*s}px`;
  };
  fit(); window.addEventListener('resize',fit);
  window.game=new Game(canvas);
});
</script>
