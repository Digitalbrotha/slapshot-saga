<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Cup Match-3 — Design Concepts</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0b1622;
      --surface: rgba(255,255,255,0.055);
      --border: rgba(255,255,255,0.09);
      --text: #dce8f5;
      --muted: #6b8099;
      --gold: #ffd040;
    }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 70% 60% at 15% 50%, rgba(0,80,30,0.22) 0%, transparent 100%),
        radial-gradient(ellipse 70% 60% at 85% 50%, rgba(0,30,100,0.22) 0%, transparent 100%);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 48px 20px 80px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 56px 56px;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 1240px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 60px;
    }

    .header-pill {
      display: inline-block;
      background: rgba(255,208,64,0.12);
      border: 1px solid rgba(255,208,64,0.35);
      color: var(--gold);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 5px 18px;
      border-radius: 100px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 900;
      letter-spacing: -1.5px;
      line-height: 1.05;
      margin-bottom: 12px;
    }

    h1 em {
      font-style: normal;
      background: linear-gradient(130deg, #ffd040 0%, #ff7c20 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-sub {
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* ── Concept grid ── */
    .concepts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    @media (max-width: 900px) {
      .concepts-grid { grid-template-columns: 1fr; max-width: 440px; margin: 0 auto; }
    }

    .concept-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 26px;
      display: flex;
      flex-direction: column;
      gap: 0;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .concept-card:hover {
      border-color: rgba(255,255,255,0.18);
      box-shadow: 0 0 40px rgba(0,0,0,0.4);
    }

    .concept-tag {
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 7px;
    }

    .concept-title {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 7px;
      line-height: 1.2;
    }

    .concept-desc {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 22px;
    }

    .section-label {
      font-size: 0.63rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* ── Tile showcase ── */
    .tile-showcase {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 22px;
    }

    .tile-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .tile {
      width: 78px;
      height: 78px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .tile::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        inset 0 -2px 0 rgba(0,0,0,0.25);
      pointer-events: none;
    }

    .tile:hover {
      transform: translateY(-5px) scale(1.07);
      box-shadow: 0 14px 36px rgba(0,0,0,0.55);
      z-index: 2;
    }

    .tile-label {
      font-size: 0.59rem;
      color: var(--muted);
      text-align: center;
    }

    /* ── Board preview ── */
    .board-section {
      border-top: 1px solid var(--border);
      padding-top: 18px;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .board-cell {
      aspect-ratio: 1;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
  </style>
</head>
<body>
<div class="page">

  <header>
    <div class="header-pill">Design Showcase</div>
    <h1>World Cup <em>Match-3</em></h1>
    <p class="header-sub">Three graphic concepts for tile design — review and choose your favorite</p>
  </header>

  <div class="concepts-grid" id="concepts"></div>

</div>

<script>
// ─── Country palette ───────────────────────────────────────────────────────
const COUNTRIES = [
  { name: 'Brazil',      primary: '#FFD700', band: '#009C3B',  number: 10 },
  { name: 'France',      primary: '#002395', band: '#ED2939',  number: 7  },
  { name: 'England',     primary: '#CE1124', band: '#FFFFFF',  number: 9  },
  { name: 'Argentina',   primary: '#74ACDF', band: '#FFFFFF',  number: 10 },
  { name: 'Netherlands', primary: '#FF6700', band: '#1B3869',  number: 11 },
  { name: 'Germany',     primary: '#E0E0E0', band: '#1C1C1C',  number: 8  },
];

// Deterministic board layout (indices into COUNTRIES)
const BOARD = [0,2,4,1,3, 3,5,1,0,2, 4,0,3,5,1];

// ─── Helpers ──────────────────────────────────────────────────────────────
function uid(s) { return s.replace(/[^a-z0-9]/gi, ''); }

// Returns array of [x,y] for a regular n-gon
function ngon(cx, cy, r, n, startDeg = -90) {
  return Array.from({ length: n }, (_, i) => {
    const a = (startDeg + i * 360 / n) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  });
}

function polygonPath(pts) {
  return 'M' + pts.map(p => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join('L') + 'Z';
}

// Perceived luminance – decides text color
function isLight(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) > 155;
}

// ─── SVG: Shorts ─────────────────────────────────────────────────────────
function shortsSVG(color, band, s) {
  const id = uid(color + band + s);
  const x1 = 0.13*s, x2 = 0.87*s;
  const y1 = 0.07*s;               // waistband top
  const y2 = y1 + 0.17*s;          // waistband bottom / body top
  const y3 = 0.70*s;               // crotch
  const y4 = 0.95*s;               // leg hem
  const xm = s / 2;
  const gap = 0.04*s;

  // Shorts body path: rectangle top, two legs at bottom
  const body = `M${x1},${y2} H${x2} V${y3} H${xm+gap} V${y4} H${xm-gap} V${y3} H${x1} Z`;

  return `<svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sg${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.18)"/>
      </linearGradient>
      <filter id="sf${id}"><feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="rgba(0,0,0,0.35)"/></filter>
    </defs>
    <!-- Shorts body -->
    <path d="${body}" fill="${color}" filter="url(#sf${id})"/>
    <path d="${body}" fill="url(#sg${id})" opacity="0.55"/>
    <!-- Center seam -->
    <line x1="${xm}" y1="${y2}" x2="${xm}" y2="${y3}" stroke="rgba(0,0,0,0.12)" stroke-width="${(0.022*s).toFixed(1)}"/>
    <!-- Waistband -->
    <rect x="${x1}" y="${y1}" width="${x2-x1}" height="${y2-y1}" rx="${0.055*s}" fill="${band}"/>
    <rect x="${x1}" y="${y1}" width="${x2-x1}" height="${(y2-y1)*0.45}" rx="${0.055*s}" fill="rgba(255,255,255,0.22)"/>
    <!-- Waistband seam dot -->
    <circle cx="${xm}" cy="${(y1+(y2-y1)/2).toFixed(1)}" r="${(0.045*s).toFixed(1)}" fill="rgba(255,255,255,0.6)" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
  </svg>`;
}

// ─── SVG: Soccer Ball ────────────────────────────────────────────────────
function ballSVG(color, s) {
  const cx = s/2, cy = s/2;
  const r  = s * 0.43;
  const pr = r * 0.37;  // inner pentagon radius
  const id = uid(color + s);

  const pts = ngon(cx, cy, pr, 5, -90);
  const pentPath = polygonPath(pts);

  // Lines from each pentagon vertex to ball edge
  const edgeLines = pts.map(([px, py]) => {
    const a  = Math.atan2(py - cy, px - cx);
    const ex = (cx + r * Math.cos(a)).toFixed(2);
    const ey = (cy + r * Math.sin(a)).toFixed(2);
    return `M${px.toFixed(2)},${py.toFixed(2)} L${ex},${ey}`;
  }).join('');

  // Hexagon approximations between the 5 outer points (connecting arcs)
  const outerEdges = pts.map(([px, py], i) => {
    const [nx, ny] = pts[(i+1) % 5];
    // midpoint pushed outward
    const mx = ((px+nx)/2 - cx) * 1.4 + cx;
    const my = ((py+ny)/2 - cy) * 1.4 + cy;
    return `M${px.toFixed(2)},${py.toFixed(2)} Q${mx.toFixed(2)},${my.toFixed(2)} ${nx.toFixed(2)},${ny.toFixed(2)}`;
  }).join('');

  return `<svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="bc${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>
      <radialGradient id="bg${id}" cx="38%" cy="33%" r="60%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.32)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.24)"/>
      </radialGradient>
      <filter id="bsh${id}"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.4)"/></filter>
    </defs>
    <!-- Ball base -->
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" filter="url(#bsh${id})"/>
    <!-- Lighting -->
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#bg${id})"/>
    <!-- Pattern (clipped) -->
    <g clip-path="url(#bc${id})">
      <path d="${pentPath}"   fill="rgba(0,0,0,0.38)" stroke="rgba(0,0,0,0.55)" stroke-width="${(s*0.028).toFixed(1)}" stroke-linejoin="round"/>
      <path d="${edgeLines}"  fill="none"             stroke="rgba(0,0,0,0.28)" stroke-width="${(s*0.022).toFixed(1)}"/>
      <path d="${outerEdges}" fill="none"             stroke="rgba(0,0,0,0.18)" stroke-width="${(s*0.018).toFixed(1)}"/>
    </g>
    <!-- Outline -->
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(0,0,0,0.55)" stroke-width="1.5"/>
    <!-- Specular highlight -->
    <ellipse cx="${(cx-r*0.2).toFixed(1)}" cy="${(cy-r*0.27).toFixed(1)}"
             rx="${(r*0.24).toFixed(1)}" ry="${(r*0.14).toFixed(1)}"
             fill="white" opacity="0.42"
             transform="rotate(-28,${(cx-r*0.2).toFixed(1)},${(cy-r*0.27).toFixed(1)})"/>
  </svg>`;
}

// ─── SVG: Badge ──────────────────────────────────────────────────────────
function badgeSVG(color, number, s) {
  const cx = s/2, cy = s/2;
  const r  = s * 0.43;
  const id = uid(color + number + s);
  const textCol = isLight(color === '#E0E0E0' ? '#c0c0c0' : color) ? '#1a1a2e' : '#ffffff';

  // 8-point star path
  function star(x, y, ro, ri) {
    const pts = Array.from({length:16}, (_, i) => {
      const a = (i * 22.5 - 90) * Math.PI / 180;
      return [(x + (i%2===0 ? ro : ri) * Math.cos(a)).toFixed(2),
              (y + (i%2===0 ? ro : ri) * Math.sin(a)).toFixed(2)].join(',');
    });
    return 'M' + pts.join('L') + 'Z';
  }

  // 5 small stars in the badge border (at 12 o'clock and surrounding)
  const ringR = r * 0.78;
  const starAngles = [-90, -54, -18, 18, 54];
  const starsHTML = starAngles.map(deg => {
    const a = deg * Math.PI / 180;
    const sx = cx + ringR * Math.cos(a);
    const sy = cy + ringR * Math.sin(a);
    return `<path d="${star(sx, sy, s*0.055, s*0.022)}" fill="#FFD040" opacity="0.9"/>`;
  }).join('');

  return `<svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bdg${id}" cx="40%" cy="35%" r="65%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.32)"/>
      </radialGradient>
      <filter id="bdf${id}"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.45)"/></filter>
    </defs>
    <!-- Outer ring -->
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" stroke="rgba(255,255,255,0.2)" stroke-width="${(s*0.055).toFixed(1)}" filter="url(#bdf${id})"/>
    <!-- Inner dark area -->
    <circle cx="${cx}" cy="${cy}" r="${(r*0.66).toFixed(1)}" fill="rgba(0,0,0,0.35)"/>
    <!-- Gradient -->
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#bdg${id})"/>
    <!-- Decorative inner border -->
    <circle cx="${cx}" cy="${cy}" r="${(r*0.66).toFixed(1)}" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="${(s*0.015).toFixed(1)}"/>
    <!-- Stars in ring -->
    ${starsHTML}
    <!-- Jersey number -->
    <text x="${cx}" y="${cy}"
          text-anchor="middle" dominant-baseline="central"
          fill="${textCol}"
          font-size="${(s*0.34).toFixed(1)}"
          font-weight="900"
          font-family="'Segoe UI', Arial, sans-serif"
          letter-spacing="-1">${number}</text>
  </svg>`;
}

// ─── Tile color backgrounds ───────────────────────────────────────────────
function tileBg(hex, factor = 0.28) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.round(r*factor)},${Math.round(g*factor)},${Math.round(b*factor)})`;
}

// ─── Concept definitions ──────────────────────────────────────────────────
const concepts = [
  {
    tag:   'Concept 01',
    title: 'Colored Shorts Tiles',
    desc:  'Each tile is a pair of soccer shorts in a national team color. The waistband stripe shows the second accent color. Unique, thematic, and instantly recognizable — closest to the "shorts placement" match-3 idea.',
    type:  'shorts',
    svgFn: (c, s) => shortsSVG(c.primary, c.band, s),
    bgFn:  (c)    => tileBg(c.primary, 0.3),
  },
  {
    tag:   'Concept 02',
    title: 'Soccer Ball Panels',
    desc:  'Each tile is a soccer ball filled with a national team color. The classic pentagon-and-hexagon seam pattern overlays the team color, making every tile instantly read as a ball while staying colorful and distinct.',
    type:  'ball',
    svgFn: (c, s) => ballSVG(c.primary, s),
    bgFn:  (c)    => tileBg(c.primary, 0.28),
  },
  {
    tag:   'Concept 03',
    title: 'Jersey Number Badges',
    desc:  'Each tile is a round badge styled like a jersey number patch. The team color fills the outer ring, gold stars decorate the border, and the jersey number sits bold in the center. High contrast at small sizes.',
    type:  'badge',
    svgFn: (c, s) => badgeSVG(c.primary, c.number, s),
    bgFn:  (_)    => 'rgba(0,0,0,0.32)',
  },
];

// ─── Render ───────────────────────────────────────────────────────────────
function render() {
  const grid = document.getElementById('concepts');

  grid.innerHTML = concepts.map(concept => {

    // 6 large tiles
    const tilesHTML = COUNTRIES.map(c => `
      <div class="tile-item">
        <div class="tile" style="background:${concept.bgFn(c)}">
          ${concept.svgFn(c, 54)}
        </div>
        <span class="tile-label">${c.name}</span>
      </div>
    `).join('');

    // Board preview (15 small tiles, deterministic layout)
    const boardHTML = BOARD.map(i => {
      const c = COUNTRIES[i];
      return `<div class="board-cell" style="background:${concept.bgFn(c)}">${concept.svgFn(c, 28)}</div>`;
    }).join('');

    return `
      <div class="concept-card">
        <div class="concept-tag">${concept.tag}</div>
        <div class="concept-title">${concept.title}</div>
        <div class="concept-desc">${concept.desc}</div>

        <div class="section-label">Tile Examples</div>
        <div class="tile-showcase">${tilesHTML}</div>

        <div class="board-section">
          <div class="section-label">Board Preview (3 × 5)</div>
          <div class="board-grid">${boardHTML}</div>
        </div>
      </div>
    `;
  }).join('');
}

render();
</script>
</body>
</html>
